name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ✅ Use a *recent* version of the action
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pin a real version if you want; otherwise you can just omit this
          version: 3.1.69

      # (Optional but very useful) sanity check
      - name: Verify emsdk
        run: |
          emcc -v
          emcmake cmake --version

      - name: Build WASM
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake ..
          cmake --build .

      - name: Verify WASM artifacts
        run: |
          ls -la web/public/wasm/
          test -f web/public/wasm/sudoku-engine.js
          test -f web/public/wasm/sudoku-engine.wasm

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

